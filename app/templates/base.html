<!doctype html>
<html lang="nb">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}grocious{% endblock %}</title>
<link rel="stylesheet" href="/themes.css">
<link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
<script>/* apply the remembered theme before first paint */
try { var th = localStorage.getItem("grocious.theme"); if (th && th !== "auto") document.documentElement.setAttribute("data-theme", th); } catch (e) {}
</script>
<link rel="icon" href="/favicon.ico?v=2" sizes="any">
<link rel="icon" type="image/png" sizes="32x32" href="/static/brand/grocious-icon-32.png?v=2">
<link rel="icon" type="image/png" sizes="16x16" href="/static/brand/grocious-icon-16.png?v=2">
<link rel="icon" type="image/svg+xml" href="/static/brand/grocious-icon.svg?v=2">
<link rel="apple-touch-icon" sizes="180x180" href="/static/brand/apple-touch-icon.png?v=2">
<link rel="mask-icon" href="/static/brand/grocious-mask.svg?v=2" color="#1d2021">
<link rel="manifest" href="/manifest.webmanifest">
<meta name="theme-color" content="#1d2021">
</head>
<body>
<header class="top">
  <a class="brand" href="/" aria-label="grocious"><span class="brand-logo" role="img" aria-label="grocious"></span></a>
  <span class="tagline">kvitteringer · bonus · oversikt</span>
  <div class="meta">
    <a href="/inbox">Innboks</a>
    {% if demo %}<span class="chip demo" title="GROCIOUS_DEMO=1: anonymiserte fixtures, ingen ekte tokens">DEMO</span>{% endif %}
    <details class="settings-menu">
      <summary aria-label="Innstillinger" title="Innstillinger"><svg aria-hidden="true" viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"><path d="M4 7h16M4 17h16"/><circle cx="9" cy="7" r="3" fill="var(--card)"/><circle cx="15" cy="17" r="3" fill="var(--card)"/></svg></summary>
      <div class="settings-popover"><h2>Innstillinger</h2><label for="theme" class="settings-label">Utseende</label>
    <label class="theme-pick" title="Tema (husk i nettleseren)">
      <span class="ico" aria-hidden="true">◐</span>
      <select id="theme" aria-label="Tema">
        <option value="auto">Auto (system)</option>
        {% for th in themes %}<option value="{{ th.id }}">{{ th.label }}</option>{% endfor %}
      </select>
    </label>
      </div>
    </details>
  </div>
</header>
<main class="wrap">
{% block content %}{% endblock %}
</main>
<footer class="foot">
  <span>Live oversikter caches 5 min · kvitteringsarkiv lagres lokalt</span>
  <span class="links"><a href="/api/summary">api/summary</a>{% if current_month %} · <a href="/api/export/{{ current_month }}.csv">eksport {{ current_month }}</a>{% endif %}</span>
</footer>
<script src="{{ url_for('static', filename='app.js') }}"></script>
<script>if ("serviceWorker" in navigator) navigator.serviceWorker.register("/sw.js").catch(() => {});</script>
</body>
</html>
