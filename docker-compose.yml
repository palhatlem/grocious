# grocery — self-hosted Norwegian grocery bonus tooling.
# Set GROCIOUS_HOME in the local .env to select the private runtime directory.
services:
  trumf-fetch:
    build: .
    image: grocery-fetch:latest
    container_name: grocery-trumf-fetch
    command: ["trumf_client.py"]
    env_file: ${GROCIOUS_HOME:-.}/.env
    environment: [TRUMF_STATE=/data/trumf_state.json, TZ=Europe/Oslo]
    volumes: ["${GROCIOUS_HOME:-.}/data:/data"]
    restart: "no"

  rema-fetch:
    build: .
    image: grocery-fetch:latest
    container_name: grocery-rema-fetch
    command: ["rema_client.py"]        # fetches receipts/offers; activation is explicitly opt-in
    env_file: ${GROCIOUS_HOME:-.}/.env
    environment: [REMA_DATA=/data, TZ=Europe/Oslo]
    volumes: ["${GROCIOUS_HOME:-.}/data:/data"]
    restart: "no"

  web:
    build: {context: ., dockerfile: Dockerfile.web}
    image: grocery-web:latest
    container_name: grocery-web
    env_file: ${GROCIOUS_HOME:-.}/.env
    environment: [GROCERY_DATA=/data, TZ=Europe/Oslo]
    volumes: ["${GROCIOUS_HOME:-.}/data:/data"]
    ports: ["127.0.0.1:3012:3012"]
    restart: unless-stopped

  # (re)login — interactive, enter the SMS code when prompted. Run when tokens expire.
  trumf-login:
    build: ./login
    image: grocery-login:latest
    command: ["trumf_login.py"]
    profiles: ["login"]
    env_file: ${GROCIOUS_HOME:-.}/.env
    environment: [PLAYWRIGHT_BROWSERS_PATH=/ms-playwright]
    volumes: ["${GROCIOUS_HOME:-.}:/work", "${GROCIOUS_HOME:-.}/data:/data"]

  rema-login:
    build: ./login
    image: grocery-login:latest
    command: ["rema_login.py"]
    profiles: ["login"]
    env_file: ${GROCIOUS_HOME:-.}/.env
    environment: [PLAYWRIGHT_BROWSERS_PATH=/ms-playwright]
    volumes: ["${GROCIOUS_HOME:-.}:/work", "${GROCIOUS_HOME:-.}/data:/data"]

  # Enable only after IMAP credentials and Bridge connectivity are configured.
  inbox-mail:
    build: {context: ., dockerfile: Dockerfile.web}
    image: grocery-web:latest
    command: ["python", "-m", "inbox.mailworker"]
    profiles: ["mail"]
    env_file: ${GROCIOUS_HOME:-.}/.env
    environment: [GROCERY_DATA=/data, TZ=Europe/Oslo]
    volumes: ["${GROCIOUS_HOME:-.}/data:/data"]
    restart: unless-stopped
